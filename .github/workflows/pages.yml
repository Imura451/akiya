# 空き家の管理人を GitHub Pages に自動公開する
#
# main ブランチに送られるたびに、node build.js を実行して docs/ を公開します。
# GitHub の Settings → Pages → Source を「GitHub Actions」にしておく必要があります。
name: 空き家の管理人を公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 保存先を取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3言語のページを書き出す
        run: node build.js

      - name: Pages の設定
        uses: actions/configure-pages@v5

      - name: 公開ファイルをまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
